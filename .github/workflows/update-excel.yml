name: Auto Update Gold Price Excel

on:
  schedule:
    - cron: '*/30 * * * *' # ตั้งเวลาให้รันทุกๆ 30 นาที
  workflow_dispatch: # ปุ่มให้เรากดรันมือได้จากหน้าเว็บ GitHub
  repository_dispatch:    # <--- เพิ่มบรรทัดนี้ เพื่อให้รับคำสั่งจาก cron-job ได้
    types: [trigger-update]

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas openpyxl

      - name: Run Python script
        run: python "gold-price-updater.py"

      - name: Commit and push changes if file changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add controller.xlsx
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update gold price Excel [skip ci]" && git push)

      - name: Commit and push changes if file changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add controller.xlsx
          # เช็คก่อนว่าไฟล์มีการเปลี่ยนแปลงจริงมั้ย ถ้าไม่มีให้ผ่านไปเลยไม่ต้อง Error
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update gold price Excel [skip ci]" && git push)
